services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: klinik-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-klinik.ini:ro
    networks:
      - klinik-net

  nginx:
    image: nginx:1.27-alpine
    container_name: klinik-nginx
    restart: unless-stopped
    ports:
      - "5077:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - klinik-net

  db:
    image: mysql:8.0
    container_name: klinik-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-klinik_griya_husada_1}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3307:3306"
    volumes:
      - klinik-db-data:/var/lib/mysql
    networks:
      - klinik-net

volumes:
  klinik-db-data:

networks:
  klinik-net:
    driver: bridge
