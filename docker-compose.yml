services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: klinik-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-klinik.ini:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - klinik-net

  nginx:
    image: nginx:1.27-alpine
    container_name: klinik-nginx
    restart: unless-stopped
    ports:
      - "5077:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - klinik-net

networks:
  klinik-net:
    driver: bridge
